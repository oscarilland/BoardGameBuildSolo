name: CI

# Checks every push: the game's build, tests and coverage rule (ADR-003),
# a start-up check of the packaged jar, and the wiki lint.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build, test and check coverage
        run: ./mvnw -B verify

      - name: Packaged jar loads its data
        run: java -jar target/net-zero-belfast.jar --check

      - name: Wiki lint
        run: java scripts/WikiLint.java
