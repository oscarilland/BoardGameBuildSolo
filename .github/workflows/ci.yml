name: CI

# Checks every push. Java build and test steps are added by plan 001, once
# ADR-003 has chosen the build tool.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Wiki lint
        run: java scripts/WikiLint.java
